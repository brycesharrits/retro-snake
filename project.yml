name: RetroSnake

options:
  bundleIdPrefix: com.brycesharrits
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

targets:
  RetroSnake:
    type: application
    platform: iOS
    sources:
      - path: RetroSnake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycesharrits.RetroSnake
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES

  RetroSnakeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RetroSnakeTests
    dependencies:
      - target: RetroSnake
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brycesharrits.RetroSnakeTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"

schemes:
  RetroSnake:
    build:
      targets:
        RetroSnake: all
        RetroSnakeTests: [test]
    test:
      targets:
        - RetroSnakeTests
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
